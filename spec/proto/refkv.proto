// The messages of every refkv store, whatever its binding: spec/refkv.md, Appendix A
// (format version 0). spec/tools/test_proto.py checks that this file and that appendix match;
// edit both. Messages that one binding alone uses are in that binding's file (vzip.proto).
syntax = "proto3";
package refkv.v0;

message Range {
  uint32 source = 1;
  reserved 2;
  uint64 offset = 3;
  uint64 length = 4;
  optional bytes data = 5;
  optional uint32 crc32c = 6;
}

message Concat {
  repeated Range parts = 1;
}

message Source {
  oneof kind {
    string url  = 1;
    string key  = 2;
    bytes  data = 3;
  }
  optional uint64 size               = 4;
  optional string etag               = 5;
  optional int64  modified_not_after = 6;
}

message SourceTable {
  repeated Source sources = 1;
  optional uint32 revision = 2;
}
