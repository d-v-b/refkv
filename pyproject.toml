[project]
name = "refkv"
version = "0.1.0"
description = "refkv: a reference value type for key-value stores, its ZIP binding (vzip archives), and virtualization of image files and stores"
# the PyPI page (README.md, the repository's, links to its files by relative path)
readme = "python/README.md"
authors = [
    { name = "Davis Vann Bennett", email = "davis.v.bennett@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
# The base install reads and writes vzip archives, holds a ReferenceStore and
# virtualizes image files and stores, without Zarr (numpy: refkv.shards), through
# the Rust core this package builds and ships as the module refkv._ir (below); the
# extras add the rest (python/src/refkv/_extras.py), and the dependency groups hold
# what only this repository's tests, fixture generators and benchmarks use.
dependencies = [
    "google-crc32c>=1.9.0",
    "numpy>=2.5.3",
    "obstore>=0.11.1",
]

[project.urls]
Repository = "https://github.com/d-v-b/refkv"
Documentation = "https://github.com/d-v-b/refkv/tree/main/docs"

[project.optional-dependencies]
# refkv.zarr: a reference store as a read-only zarr store, for zarr and xarray, and the codecs
# of archives of virtualized image files and stores
zarr = [
    "zarr>=3.4.0",
]
# the JPEG, JPEG 2000 and JPEG XR decoders of refkv.zarr's image codecs
images = [
    "refkv[zarr]",
    "imagecodecs>=2026.8.16",
]
# ReferenceStore.from_virtualizarr, refkv.convert and refkv.shards, which build Zarr
# metadata. refkv does not import xarray: it calls the methods of the datasets
# VirtualiZarr builds
virtualizarr = [
    "refkv[zarr]",
    "virtualizarr>=2.7.3",
]

# One distribution: the Python package python/src/refkv, with the Rust core rust/refkv-ir
# compiled into it as the module refkv._ir, so refkv always runs the core of its own
# commit. Building it needs a Rust toolchain. This file stays at the root, where the
# conformance harnesses and the fixture generators share its environment.
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/refkv-ir/Cargo.toml"
features = ["python"]
module-name = "refkv._ir"
python-source = "python/src"

[dependency-groups]
# the tests, and the fixture generators and verifiers (fixtures/generators, js/test/*/verify.py),
# and what the example of docs/virtual-datasets.md imports besides refkv: xarray, VirtualiZarr's
# HDF5 parser (h5py), and xarray reading netCDF files over HTTPS (h5netcdf, fsspec, aiohttp)
dev = [
    "refkv[zarr,images,virtualizarr]",
    "aiohttp>=3.14.3",
    "czifile>=2026.8.16",
    "fsspec>=2026.9.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "jsonschema>=4.26.0",
    "nd2>=0.12.0",
    "nibabel>=5.4.2",
    "ome-zarr-models>=1.8.1",
    "protobuf>=7.36.2",
    "pydicom>=3.0.2",
    "pylibczirw>=6.1.0",
    "pyproj>=3.8.0",
    "pytest>=9.1.1",
    "rasterio>=1.5.2",
    "tifffile>=2026.9.20",
    "xarray>=2026.9.0",
    "zarr-n5>=0.3.1",
]
# the comparison with kerchunk and Icechunk (design/comparison, design/experiments)
bench = [
    "fastparquet>=2026.9.0",
    "icechunk>=2.2.2",
    "kerchunk>=0.2.10",
    "pyarrow>=25.0.1",
]

[tool.uv]
# rebuild the core when its Rust sources or source models change (`uv sync`, `uv run`)
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/refkv-ir/Cargo.toml" },
    { file = "rust/refkv-ir/Cargo.lock" },
    { file = "rust/refkv-ir/src/**/*.rs" },
    { file = "rust/refkv-ir/schema/*.json" },
]
# `uv sync` and `uv run` install every group, as CI's `uv sync --all-groups` does
default-groups = "all"
