[project]
name = "vzip"
version = "0.1.0"
description = "vzip: ZIP plus a reference value type, for virtual stores (reference implementation and experiments)"
authors = [
    { name = "Davis Vann Bennett", email = "davis.v.bennett@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
# The base install reads and writes vzip archives and holds a ReferenceStore; the
# extras add the rest (python/src/vzip/_extras.py), and the dependency groups hold
# what only this repository's tests, fixture generators and benchmarks use.
dependencies = [
    "google-crc32c>=1.9.0",
    "numpy>=2.5.3",
    "obstore>=0.11.1",
    "zarr>=3.4.0",
]

[project.optional-dependencies]
# ReferenceStore.from_virtualizarr and vzip.convert, and the netCDF workflow of
# docs/virtual-datasets.md: VirtualiZarr's HDF5 parser (h5py), and xarray reading
# netCDF files over HTTPS (h5netcdf, fsspec, aiohttp) to check the archive's values
virtualizarr = [
    "aiohttp>=3.14.3",
    "fsspec>=2026.9.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "virtualizarr>=2.7.3",
    "xarray>=2026.9.0",
]
# the JPEG, JPEG 2000 and JPEG XR codecs of archives of virtualized image files
images = [
    "imagecodecs>=2026.8.16",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# the package is python/src/vzip; this file stays at the root, where the conformance
# harnesses, the fixture generators and the Rust core's `maturin develop` share its environment
module-root = "python/src"

[dependency-groups]
# the tests, and the fixture generators and verifiers (fixtures/generators, js/test/*/verify.py)
dev = [
    "vzip[virtualizarr,images]",
    "czifile>=2026.8.16",
    "jsonschema>=4.26.0",
    "nd2>=0.12.0",
    "nibabel>=5.4.2",
    "ome-zarr-models>=1.8.1",
    "protobuf>=7.36.2",
    "pydicom>=3.0.2",
    "pylibczirw>=6.1.0",
    "pyproj>=3.8.0",
    "pytest>=9.1.1",
    "rasterio>=1.5.2",
    "tifffile>=2026.9.20",
    "zarr-n5>=0.3.1",
]
# the comparison with kerchunk and Icechunk (design/comparison, design/experiments)
bench = [
    "fastparquet>=2026.9.0",
    "icechunk>=2.2.2",
    "kerchunk>=0.2.10",
    "pyarrow>=25.0.1",
]

[tool.uv]
# `uv sync` and `uv run` install every group, as CI's `uv sync --all-groups` does
default-groups = "all"
