# The refkv-phkv distribution: the perfect-hash binding of refkv (spec/bindings/phkv.md) for
# Python, the package src/refkv_phkv with its bindings to the Rust crate rust/refkv-phkv (the
# crate ../rust/refkv-phkv-python) compiled into it as the module refkv_phkv._core. A
# distribution of its own, beside refkv (../python), so that the draft binding can change
# without the ZIP binding noticing (design/plans/split-bindings.md). It depends on refkv for
# the value type, the reader and the policy, and registers itself with it as the binding
# "phkv" (refkv.open(url, binding="phkv")). Building it needs a Rust toolchain.
[build-system]
requires = ["maturin>=1.9.2,<2"]
build-backend = "maturin"

[project]
name = "refkv-phkv"
# from the bindings' Cargo.toml, whose committed version is a placeholder: tools/version.py
# writes the one `git describe` gives, for a build (the same as refkv's)
dynamic = ["version"]
description = "refkv-phkv: the perfect-hash binding of refkv, phkv stores, which a reader looks keys up in with a few ranged reads"
readme = "README.md"
authors = [
    { name = "Davis Vann Bennett", email = "davis.v.bennett@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    # reference.save and the reader's internals (refkv.reader), which phkv stores share with
    # every reference store. refkv-phkv uses them, so the two are released together
    "refkv",
]

[project.urls]
Repository = "https://github.com/d-v-b/refkv"
Documentation = "https://github.com/d-v-b/refkv/tree/main/python-phkv"
Issues = "https://github.com/d-v-b/refkv/issues"

# `refkv.open(url, binding="phkv")` and `refkv.bindings()` find this binding here
[project.entry-points."refkv.bindings"]
phkv = "refkv_phkv:open"

[project.optional-dependencies]
# refkv.zarr.open(url, binding="phkv"): a phkv store as a read-only zarr store
zarr = [
    "refkv[zarr]",
]

[tool.maturin]
manifest-path = "../rust/refkv-phkv-python/Cargo.toml"
module-name = "refkv_phkv._core"
python-source = "src"

[tool.uv]
# rebuild the bindings when they or the crate they bind change (`uv sync`, `uv run`)
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../rust/refkv-phkv-python/Cargo.toml" },
    { file = "../rust/refkv-phkv-python/Cargo.lock" },
    { file = "../rust/refkv-phkv-python/build.rs" },
    { file = "../rust/refkv-phkv-python/src/**/*.rs" },
    { file = "../rust/refkv-phkv/Cargo.toml" },
    { file = "../rust/refkv-phkv/src/**/*.rs" },
    { file = "../rust/refkv-vzip/Cargo.toml" },
    { file = "../rust/refkv-vzip/src/**/*.rs" },
]
