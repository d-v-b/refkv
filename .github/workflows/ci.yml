# Offline checks on every push and pull request: the Python package's tests and its
# install without extras, the browser code's type check and Node tests, the IR core's
# tests, the fixture
# comparison of the virtualizers against the frozen reference (spec/virtualize.md §1.1
# <https://github.com/d-v-b/vzip/blob/main/spec/virtualize.md#11-output-and-equivalence>, with
# spec/archive.md's strict reading of every archive), the reproducibility of the fixture
# generators, and the section references, each a link to a heading that exists. TIFF, NDPI, ND2, CZI, DICOM, NIfTI, IMS and SAFE, and Zarr v2, OME-Zarr and N5 stores, go through the Rust core (rust/refkv-ir), built natively
# for Python (`uv sync`, which builds it into vzip as the module vzip_ir) and for wasm32 for the browser code (`just js::wasm`).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/refkv-ir
      # binaryen's wasm-opt shrinks the wasm32 module (rust/refkv-ir/wasm/build.sh; optional)
      - run: sudo apt-get install -y --no-install-recommends binaryen
      - run: uv sync --all-groups --locked
      - run: npm ci
        working-directory: js
      - run: just js::wasm
      # builds the Rust core first, and runs python/tests/ir with the rest
      - run: just test

  # The JS library and its tests run on the oldest Node that js/package.json's engines
  # allows (the LTS most users have) and on the newest (what the project develops on);
  # Node's behavior differs between them, e.g. how fetch goes through a proxy.
  node:
    name: node (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # js::test also builds the test module (test-only hooks) in its own target directory,
      # rust/refkv-ir/target/test-hooks; cache it beside the shipped module's
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/refkv-ir -> target
            rust/refkv-ir -> target/test-hooks
      # binaryen's wasm-opt shrinks the wasm32 module (rust/refkv-ir/wasm/build.sh; optional)
      - run: sudo apt-get install -y --no-install-recommends binaryen
      - run: npm ci
        working-directory: js
      - run: just js::test

  ir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/refkv-ir
      # binaryen's wasm-opt shrinks the wasm32 module (rust/refkv-ir/wasm/build.sh; optional)
      - run: sudo apt-get install -y --no-install-recommends binaryen
      - uses: extractions/setup-just@v2
      - run: uv sync --all-groups --locked
      # the Python host's tests (python/tests/ir) run in the pytest job, with the rest
      - run: just ir-rust-test
      - run: just ir-wasm

  fixture-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/refkv-ir
      # binaryen's wasm-opt shrinks the wasm32 module (rust/refkv-ir/wasm/build.sh; optional)
      - run: sudo apt-get install -y --no-install-recommends binaryen
      - run: uv sync --all-groups --locked
      - run: just js::wasm
      - run: >-
          uv run python conformance/virtualize/compare.py conformance/results/fixtures
          --fixtures fixtures --shard ${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-compare-${{ matrix.shard }}
          path: conformance/results/fixtures/results.json

  # The package without its extras (pyproject.toml): it reads, writes and virtualizes
  # archives without zarr, and each optional part's ImportError names the extra that
  # installs it; then with only the zarr extra, which reads them through zarr
  base-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/refkv-ir
      # pip, as docs/README.md#installing says (it builds the Rust core into the wheel)
      - run: uv venv --seed "$RUNNER_TEMP/pip"
      - run: '"$RUNNER_TEMP/pip/bin/python" -m pip install .'
      - run: just base-install-check "$RUNNER_TEMP/pip/bin/python" base
        shell: bash
      - run: uv venv "$RUNNER_TEMP/zarr"
      - run: uv pip install --python "$RUNNER_TEMP/zarr" ".[zarr]"
      - run: just base-install-check "$RUNNER_TEMP/zarr/bin/python" zarr
        shell: bash

  sections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # spec/tools imports neither vzip nor its Rust core: install the tools, not the project
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: uv sync --all-groups --locked --no-install-project
      # every "§n" is a link to its heading, and every such link resolves (spec/tools/sections.py)
      - run: just sections

  fixtures-reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/refkv-ir
      - run: uv sync --all-groups --locked
      - run: just fixtures-check
