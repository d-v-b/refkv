# Build refkv's wheels (python/: the Python package with its bindings to the Rust core, for Linux
# (glibc and musl), macOS and Windows, x86_64 and arm64: abi3 for Python >= 3.12; and, as abi3
# does not cover free-threaded Pythons, cp314t for CPython 3.14t and abi3t (PEP 803) for 3.15t
# and newer) and its sdist, at the version git's tags
# give (python/RELEASING.md), and check each installs and runs. A tag v<version> also
# publishes them to PyPI through trusted publishing (no token: PyPI trusts this workflow in
# the environment `pypi`). The tag is pushed by hand (a release candidate) or created by
# merging release-please's release PR, after which the release-please workflow dispatches
# this one at the tag. Every push to main builds them, so a break on
# another platform shows before a tag; so does a pull request that changes the build.

name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - python/pyproject.toml
      - rust/refkv-python/**
      - python/README.md
      - python/LICENSE-*
      - python/src/**
      - python/tools/**
      - python/tests/check_base_install.py
      - rust/refkv-ir/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

# bash on every runner (Git Bash on Windows), so `dist/*.whl` is expanded on Windows too
defaults:
  run:
    shell: bash

# a newer push to main or a PR supersedes a build in progress; a tag's run is never cancelled
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }}${{ matrix.musl && ' musl' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          # musl (Alpine and the Docker images built on it), built and checked in containers
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, musl: true }
          - { os: macos-15-intel, target: x86_64 }
          - { os: macos-15, target: aarch64 }
          - { os: windows-latest, target: x64 }
          - { os: windows-11-arm, target: aarch64 }
    steps:
      # the whole history, with its tags: the version is git's (python/tools/version.py)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 3.12 runs the build and the abi3 wheel's check; 3.14t and 3.15t the free-threaded wheels'
      # checks (on Linux maturin builds in a manylinux or musllinux container, with its own
      # interpreters)
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.14t
            3.15t
            3.12
      # a tag push builds at its tag (its commit may carry another, such as an -rc tag)
      - run: python python/tools/version.py write ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      # the abi3 wheel, from 3.12 alone: with the abi3t feature on too, the interpreters of a
      # Linux container would each build a wheel of their own, and none of them abi3 (on macOS
      # and Windows maturin takes the runner's `python`, 3.12)
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: python
          args: --release --out ../dist ${{ runner.os == 'Linux' && '--interpreter 3.12' || '' }}
      # the free-threaded wheels, beside the abi3 one: 3.14t's is version-specific (cp314t),
      # 3.15t's is abi3t (rust/refkv-python/Cargo.toml's pyo3 features)
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: python
          args: --release --out ../dist --interpreter 3.14t 3.15t
      # each wheel installs, with its dependencies, and runs: read and write an archive,
      # zarrify through the core; each in a venv of its own, on its Python (on a free-threaded
      # one, the GIL stays disabled)
      - if: ${{ !matrix.musl }}
        run: |
          # a venv's Python: bin/python, or Scripts/python.exe on Windows (with RUNNER_TEMP's `\`
          # written as `/`, for Git Bash)
          tmp="${RUNNER_TEMP//\\//}"
          bin=bin/python; [ "$RUNNER_OS" = Windows ] && bin=Scripts/python.exe
          for check in "python dist/*-cp312-abi3-*.whl" "python3.14t dist/*-cp314-cp314t-*.whl" \
                       "python3.15t dist/*-cp315-abi3.abi3t-*.whl"; do
            set -- $check
            echo "::group::$1: $2"
            "$1" -m venv "$tmp/$1"
            "$tmp/$1/$bin" -m pip install "$2"
            "$tmp/$1/$bin" python/tests/check_base_install.py base
            echo "::endgroup::"
          done
      # a musllinux wheel does not install on the runner's glibc Python: the same check, in
      # Alpine's (the runner's architecture), of the abi3 wheel. The free-threaded musllinux
      # wheels are built, not run: no official Alpine image has a free-threaded Python.
      - if: ${{ matrix.musl }}
        run: >-
          docker run --rm -v "$PWD":/io -w /io python:3.12-alpine
          sh -c 'python -m pip install dist/*-abi3-*.whl && python python/tests/check_base_install.py base'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}${{ matrix.musl && '-musl' || '' }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # the whole history, with its tags: the version is git's (python/tools/version.py)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # a tag push builds at its tag (its commit may carry another, such as an -rc tag)
      - run: python python/tools/version.py write ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: python
          args: --out ../dist
      # the sdist builds on its own (it holds the bindings and the Rust core,
      # ../rust/refkv-python and ../rust/refkv-ir) and runs
      - run: python -m pip install dist/*.tar.gz
      - run: python python/tests/check_base_install.py base
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # the tag names the version the distributions carry, as PEP 440 spells it (v1.2.3-rc.1: 1.2.3rc1)
      - run: |
          v="$(python3 python/tools/version.py pep440 "${GITHUB_REF_NAME#v}")"
          ls dist
          for f in dist/*; do case "$(basename "$f")" in refkv-"$v"[-.]*) ;; *) echo "::error::$f is not version $v"; exit 1;; esac; done
      - uses: pypa/gh-action-pypi-publish@release/v1
