# Build vzip's wheels (the Python package with its Rust core, abi3 for Python >= 3.12, for
# Linux and macOS) and its sdist, and check each installs and runs. A tag v<version>
# also publishes them to PyPI through trusted publishing (no token: PyPI trusts this
# workflow in the environment `pypi`). Every push to main builds them, so a break on
# another platform shows before a tag; so does a pull request that changes the build.

name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - pyproject.toml
      - python/README.md
      - LICENSE-*
      - rust/vzip-ir/**
      - python/src/vzip_ir/**
      - python/tests/check_base_install.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

# a newer push to main or a PR supersedes a build in progress; a tag's run is never cancelled
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: macos-15-intel, target: x86_64 }
          - { os: macos-15, target: aarch64 }
          # no Windows wheel yet: vzip's file: URIs assume POSIX paths (vzip.uri)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      # the wheel installs, with its dependencies, and runs: read and write an archive,
      # virtualize through the core
      - run: python -m pip install dist/*.whl
      - run: python python/tests/check_base_install.py base
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      # the sdist builds (the Rust core sits outside the project root) and runs
      - run: python -m pip install dist/*.tar.gz
      - run: python python/tests/check_base_install.py base
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # the tag names the version the distributions carry
      - run: |
          v="${GITHUB_REF_NAME#v}"
          ls dist
          for f in dist/*; do case "$(basename "$f")" in vzip-"$v"[-.]*) ;; *) echo "::error::$f is not version $v"; exit 1;; esac; done
      - uses: pypa/gh-action-pypi-publish@release/v1
