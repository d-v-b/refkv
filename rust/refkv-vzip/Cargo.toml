# The vzip archive (spec/bindings/vzip.md): the protobuf messages of spec/proto/refkv.proto and
# spec/proto/vzip.proto, hand-written as python/src/refkv/pb.py is, and the archive writer, ported
# byte for byte from python/src/refkv/vzip/archive.py's VZipWriter. A member of the workspace
# (rust/Cargo.toml): the CLI (rust/refkv-cli) depends on it by path, and so does the conformance
# harness (conformance/impls/rust), from outside the workspace.
[package]
name = "refkv-vzip"
version = "0.1.0"
edition = "2024"
description = "vzip archives: refkv's protobuf messages and the archive writer"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# RFC 3986 URI references and file: URIs, shared with the Rust core (`uri`, re-exported)
refkv-uri = { path = "../refkv-uri" }
crc32fast = "1.5"
# DEFLATE through zlib itself, built from its sources: the bytes Python's zlib.compressobj(9,
# DEFLATED, -15) gives, so that an archive matches the Python writer's byte for byte (miniz_oxide
# and zlib-rs compress differently, and a system's zlib may be zlib-ng's)
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
libz-sys = { version = "1.1", default-features = false, features = ["libc", "static"] }

[dev-dependencies]
tempfile = "3"
