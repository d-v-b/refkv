# refkv's Rust crates, one workspace: one Cargo.lock and one target directory (rust/target/).
# The independent conformance harness (conformance/impls/rust) is deliberately not a member: it
# keeps its own lock, and depends on rust/refkv-vzip by path.
#
# Features are unified only across the packages a command builds, so build a crate with
# `-p <crate>` (or its own `--manifest-path`), not with `--workspace`: the wasm32 module
# (refkv-ir/wasm/build.sh) builds refkv-ir alone, whose flate2 is pure Rust (`rust_backend`),
# while refkv-vzip and refkv-phkv ask for zlib itself, whose C sources the wasm32 build must not
# pull in.
[workspace]
members = ["refkv-uri", "refkv-ir", "refkv-vzip", "refkv-phkv", "refkv-python", "refkv-cli"]
resolver = "3"

# Profiles apply only at the workspace root; release is cargo's default (opt-level 3, no debug
# info). The wasm32 module (refkv-ir/wasm/build.sh, then wasm-opt -O3): whole-program optimization,
# one codegen unit and opt-level 2, no unwinding (a panic aborts, as it already does
# on wasm32-unknown-unknown). Against the release profile: 27% smaller (12% gzipped)
# at the same speed; opt-level "s" would be 9% smaller still, and 20% slower.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
opt-level = 2
panic = "abort"
