# refkv's Python bindings: the extension module refkv._core, over the Rust core rust/refkv-ir,
# which maturin compiles into the refkv wheel (python/pyproject.toml, whose `manifest-path`
# names this crate). A crate of its own, not a member of a Cargo workspace: the core keeps its
# own lock and profiles (its wasm32 profile only applies at its own root), and this one has no
# tests of its own.
[package]
name = "refkv-python"
# A placeholder: python/tools/version.py writes the version git describes, in release builds
# (CI runs `version.py write`; `just python::build` and `sdist` write it for the build alone);
# refkv's version is this one (python/pyproject.toml's `dynamic = ["version"]`).
version = "0.0.0"
edition = "2024"
description = "refkv's Python bindings (the module refkv._core)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]
# no Rust tests: `cargo test` only builds the module; the Python tests (python/tests) test it
test = false
doctest = false

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"] }
refkv-ir = { path = "../refkv-ir" }
refkv-phkv = { path = "../refkv-phkv" }
refkv-vzip = { path = "../refkv-vzip" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[build-dependencies]
pyo3-build-config = "0.29"

[profile.release]
opt-level = 3
debug = false
