[package]
name = "refkv-ir"
version = "0.1.0"
edition = "2024"
description = "refkv's intermediate representation: a compact columnar IR, sans-IO parsers, and the schema checker"
license = "MIT OR Apache-2.0"

[lib]
name = "refkv_ir"
# cdylib: the wasm32 module (wasm/build.sh); rlib: the Python bindings (rust/refkv-python) and
# the tests
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Test-only C-ABI hooks of the wasm32 module (`wasm/build.sh test`); never in the shipped module.
test-hooks = []

[dependencies]
miniz_oxide = "0.8"
# the transcendental functions of musl's libm, in Rust: the same results natively and in wasm32
# (the GRIB profile's map projections, spec/zarrify/grib.md §4
# <https://github.com/d-v-b/refkv/blob/main/spec/zarrify/grib.md#4-georeferencing>)
libm = "0.2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# its Deserialize trait, for a safetensors header read with no member twice (src/safetensors.rs)
serde = "1"
# a pure-Rust JPEG 2000 decoder, for GRIB's template 5.40 (src/grib/codec/jpeg2000.rs): without
# its `image` integration, or its SIMD, which leaves the wasm32 module no smaller or faster
hayro-jpeg2000 = { version = "0.4.1", default-features = false, features = ["std"] }

# build.rs reads the registry's copies (profiles/)
[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
debug = false

# The wasm32 module (wasm/build.sh, then wasm-opt -O3): whole-program optimization,
# one codegen unit and opt-level 2, no unwinding (a panic aborts, as it already does
# on wasm32-unknown-unknown). Against the release profile: 27% smaller (12% gzipped)
# at the same speed; opt-level "s" would be 9% smaller still, and 20% slower.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
opt-level = 2
panic = "abort"
