[package]
name = "refkv-ir"
version = "0.1.0"
edition = "2024"
description = "refkv's intermediate representation: a compact columnar IR, sans-IO parsers, and the schema checker"
license = "MIT OR Apache-2.0"

[lib]
name = "refkv_ir"
# cdylib: the wasm32 module (wasm/build.sh); rlib: the Python bindings (rust/refkv-python) and
# the tests
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Test-only C-ABI hooks of the wasm32 module (`wasm/build.sh test`); never in the shipped module.
test-hooks = []
# zarrs' typed Zarr v3 metadata (zarrs_metadata), the Rust counterpart of Python's zarr-metadata:
# `routines::typed` gives the coding routines' codecs as its `MetadataV3`, and the core's tests
# parse every array document refkv writes with it (`cargo test --features zarrs`)
zarrs = ["dep:zarrs_metadata"]
# The chunk map as an Arrow record batch (`array::arrow`; spec/stored-array.md §4.1
# <https://github.com/d-v-b/refkv/blob/main/spec/stored-array.md#41-the-arrow-schema>), which the
# Python bindings export through the Arrow PyCapsule interface: only rust/refkv-python enables
# it, so that the wasm32 module compiles none of Arrow
arrow = ["dep:arrow-array", "dep:arrow-buffer", "dep:arrow-schema"]

[dependencies]
miniz_oxide = "0.8"
zarrs_metadata = { version = "0.7", optional = true }
# a whole file's gzip members and bzip2 streams, read as they decode (the FITS profile's `.fits.gz`
# and `.fits.bz2`, spec/zarrify/fits.md §2.1
# <https://github.com/d-v-b/refkv/blob/main/spec/zarrify/fits.md#21-a-compressed-file>): both in
# Rust, so that the wasm32 module has them too
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
bzip2 = "0.6"
# the transcendental functions of musl's libm, in Rust: the same results natively and in wasm32
# (the GRIB profile's map projections, spec/zarrify/grib.md §4
# <https://github.com/d-v-b/refkv/blob/main/spec/zarrify/grib.md#4-georeferencing>)
libm = "0.2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# its Deserialize trait, for a safetensors header read with no member twice (src/safetensors.rs)
serde = "1"
# a pure-Rust JPEG 2000 decoder, for GRIB's template 5.40 (src/grib/codec/jpeg2000.rs): without
# its `image` integration, or its SIMD, which leaves the wasm32 module no smaller or faster
hayro-jpeg2000 = { version = "0.4.1", default-features = false, features = ["std"] }
# the feature `arrow`'s: arrays, their buffers and the schema, with the C data interface (`ffi`)
arrow-array = { version = "60.1", optional = true, features = ["ffi"] }
arrow-buffer = { version = "60.1", optional = true }
arrow-schema = { version = "60.1", optional = true, features = ["ffi"] }

# build.rs reads the registry's copies (profiles/)
[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
debug = false

# The wasm32 module (wasm/build.sh, then wasm-opt -O3): whole-program optimization,
# one codegen unit and opt-level 2, no unwinding (a panic aborts, as it already does
# on wasm32-unknown-unknown). Against the release profile: 27% smaller (12% gzipped)
# at the same speed; opt-level "s" would be 9% smaller still, and 20% slower.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
opt-level = 2
panic = "abort"
